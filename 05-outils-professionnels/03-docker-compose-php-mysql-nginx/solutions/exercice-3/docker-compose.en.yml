services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./app:/var/www/html
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: gestion_taches
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - donnees_mysql:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  donnees_mysql:
