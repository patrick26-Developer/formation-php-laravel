name: Pipeline with dependent jobs

on: push

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --prefer-dist --no-progress
      - run: ./vendor/bin/phpunit

  qualite:
    runs-on: ubuntu-latest
    needs: tests # only triggered if the "tests" job succeeded
    steps:
      - uses: actions/checkout@v4
      - name: Check code style (simulation)
        run: echo "Simulation: ./vendor/bin/php-cs-fixer fix --dry-run --diff"

# Without "needs: tests", both jobs would run IN PARALLEL by default.
# With "needs: tests", "qualite" explicitly waits for "tests" to finish
# and starts ONLY if it succeeds — useful when a step has no point
# running if the base tests are already failing.
