services:
  app:
    build: .
    depends_on: [mysql]
    environment:
      DB_HOST: mysql
      QUEUE_CONNECTION: database

  nginx:
    image: nginx:alpine
    ports: ["8000:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
    depends_on: [app]

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: saas_facturation
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql

  # Applique la facturation planifiée (routes/console.php) — nécessite
  # "php artisan schedule:work" tournant en continu (module 11.4).
  scheduler:
    build: .
    command: php artisan schedule:work
    depends_on: [app, mysql]

volumes:
  mysql_data:
